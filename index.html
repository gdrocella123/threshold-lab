<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Threshold Lab</title>
</head>
<body>
    <h1>Threshold Lab</h1>

    <table border="1">
        <tr>
            <th>
                Metric
            </th>
            <th>
                Value
            </th>
        </tr>
        <tr>
            <td>
                <b>True positives</b>
            </td>
            <td>
                {{ TP }}
            </td>
        </tr>
        <tr>
            <td>
                <b>False positives</b>
            </td>
            <td>
                {{ FP }}
            </td>
        </tr>
        <tr>
            <td>
                <b>True negatives</b>
            </td>
            <td>
                {{ TN }}
            </td>
        </tr>
        <tr>
            <td>
                <b>False negative</b>
            </td>
            <td>
                {{ FN }}
            </td>
        </tr>
        <tr>
            <td>
                <b>Accuracy</b>
            </td>
            <td>
                {{ accuracy }}
            </td>
        </tr>
    </table>
</body>

</html>
